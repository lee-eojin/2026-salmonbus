114,122.1058165769135" fill="#1e1e1e"/><line x1="580" y1="126" x2="640" y2="126" stroke="#1e1e1e" stroke-width="2"/><polygon points="640,126 630.7893900599712,129.8941834230865 630.7893900599712,122.1058165769135" fill="#1e1e1e"/><text x="610.0" y="120.0" font-size="16" fill="#1e1e1e" text-anchor="middle">true</text><line x1="930" y1="126" x2="980" y2="126" stroke="#1e1e1e" stroke-width="2"/><polygon points="980,126 970.7893900599712,129.8941834230865 970.7893900599712,122.1058165769135" fill="#1e1e1e"/><rect x="330" y="216" width="280" height="80" rx="16" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/><text x="470.0" y="252.0" font-size="16" fill="#1e1e1e" text-anchor="middle">deleteOrphan</text><text x="470.0" y="272.0" font-size="16" fill="#1e1e1e" text-anchor="middle">notification_setting 삭제</text><line x1="470" y1="176" x2="470" y2="216" stroke="#1e1e1e" stroke-width="2"/><polygon points="470,216 466.10581657691347,206.78939005997114 473.89418342308653,206.78939005997114" fill="#1e1e1e"/><text x="470.0" y="190.0" font-size="16" fill="#1e1e1e" text-anchor="middle">false</text><rect x="660" y="216" width="500" height="110" rx="16" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/><text x="910.0" y="247.0" font-size="16" fill="#1e1e1e" text-anchor="middle">claimDue(10)</text><text x="910.0" y="267.0" font-size="16" fill="#1e1e1e" text-anchor="middle">status = PENDING, next_attempt_at &lt;= now</text><text x="910.0" y="287.0" font-size="16" fill="#1e1e1e" text-anchor="middle">next_attempt_at = now + LEASE(2분)</text><text x="910.0" y="307.0" font-size="16" fill="#1e1e1e" text-anchor="middle">FOR UPDATE SKIP LOCKED</text><line x1="1070" y1="176" x2="1070" y2="216" stroke="#1e1e1e" stroke-width="2"/><polygon points="1070,216 1066.1058165769134,206.78939005997114 1073.8941834230866,206.78939005997114" fill="#1e1e1e"/><text x="1070.0" y="190.0" font-size="16" fill="#1e1e1e" text-anchor="middle">sendDue</text><rect x="40" y="336" width="270" height="100" rx="16" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="175.0" y="372.0" font-size="16" fill="#1e1e1e" text-anchor="middle">record 실패 시 로그만 남김</text><text x="175.0" y="392.0" font-size="16" fill="#1e1e1e" text-anchor="middle">PENDING 유지</text><text x="175.0" y="412.0" font-size="16" fill="#1e1e1e" text-anchor="middle">LEASE 지나면 다시 claim</text><rect x="340" y="376" width="520" height="80" rx="16" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><text x="600.0" y="412.0" font-size="16" fill="#1e1e1e" text-anchor="middle">NotificationDeliveryRunner.attempt</text><text x="600.0" y="432.0" font-size="16" fill="#1e1e1e" text-anchor="middle">ApnsClient.send: POST /3/device/{token}</text><line x1="810" y1="326" x2="810" y2="376" stroke="#1e1e1e" stroke-width="2"/><polygon points="810,376 806.1058165769135,366.78939005997114 813.8941834230865,366.78939005997114" fill="#1e1e1e"/><rect x="40" y="506" width="170" height="110" rx="16" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><text x="125.0" y="557.0" font-size="16" fill="#1e1e1e" text-anchor="middle">SENT</text><text x="125.0" y="577.0" font-size="16" fill="#1e1e1e" text-anchor="middle">HTTP 200</text><rect x="236" y="506" width="230" height="110" rx="16" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="351.0" y="547.0" font-size="16" fill="#1e1e1e" text-anchor="middle">TOKEN_REJECTED</text><text x="351.0" y="567.0" font-size="16" fill="#1e1e1e" text-anchor="middle">HTTP 410</text><text x="351.0" y="587.0" font-size="16" fill="#1e1e1e" text-anchor="middle">400 BadDeviceToken</text><rect x="492" y="506" width="240" height="110" rx="16" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="612.0" y="557.0" font-size="16" fill="#1e1e1e" text-anchor="middle">CONFIGURATION_ERROR</text><text x="612.0" y="577.0" font-size="16" fill="#1e1e1e" text-anchor="middle">그 외 응답 코드</text><rect x="758" y="506" width="300" height="110" rx="16" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/><text x="908.0" y="537.0" font-size="16" fill="#1e1e1e" text-anchor="middle">RETRYABLE</text><text x="908.0" y="557.0" font-size="16" fill="#1e1e1e" text-anchor="middle">429, status &gt;= 500</text><text x="908.0" y="577.0" font-size="16" fill="#1e1e1e" text-anchor="middle">403 ExpiredProviderToken</text><text x="908.0" y="597.0" font-size="16" fill="#1e1e1e" text-anchor="middle">전송 중 예외</text><line x1="400" y1="456" x2="125" y2="506" stroke="#1e1e1e" stroke-width="2"/><polygon points="125,506 133.36542926559156,500.5209861104041 134.75865468173143,508.1837258991735" fill="#1e1e1e"/><line x1="480" y1="456" x2="351" y2="506" stroke="#1e1e1e" stroke-width="2"/><polygon points="351,506 358.1807178146488,499.04030951360727 360.99543064058383,506.3022686045196" fill="#1e1e1e"/><line x1="612" y1="456" x2="612" y2="506" stroke="#1e1e1e" stroke-width="2"/><polygon points="612,506 608.1058165769135,496.78939005997114 615.8941834230865,496.78939005997114" fill="#1e1e1e"/><line x1="800" y1="456" x2="908" y2="506" stroke="#1e1e1e" stroke-width="2"/><polygon points="908,506 898.0056380504489,505.66424827422173 901.2777145196208,498.59656310081044" fill="#1e1e1e"/><rect x="40" y="680" width="170" height="110" rx="16" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/><text x="125.0" y="731.0" font-size="16" fill="#1e1e1e" text-anchor="middle">status = SENT</text><text x="125.0" y="751.0" font-size="16" fill="#1e1e1e" text-anchor="middle">attempts + 1</text><rect x="236" y="680" width="230" height="110" rx="16" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="351.0" y="711.0" font-size="16" fill="#1e1e1e" text-anchor="middle">devices.deleteById</text><text x="351.0" y="731.0" font-size="16" fill="#1e1e1e" text-anchor="middle">push_device 삭제</text><text x="351.0" y="751.0" font-size="16" fill="#1e1e1e" text-anchor="middle">delivery 행 CASCADE</text><text x="351.0" y="771.0" font-size="16" fill="#1e1e1e" text-anchor="middle">status 전이 없음</text><rect x="492" y="680" width="290" height="110" rx="16" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/><text x="637.0" y="721.0" font-size="16" fill="#1e1e1e" text-anchor="middle">status = GAVE_UP</text><text x="637.0" y="741.0" font-size="16" fill="#1e1e1e" text-anchor="middle">attempts + 1</text><text x="637.0" y="761.0" font-size="16" fill="#1e1e1e" text-anchor="middle">next_attempt_at = now</text><rect x="820" y="680" width="340" height="110" rx="16" fill="#c3fae8" stroke="#1e1e1e" stroke-width="2"/><text x="990.0" y="721.0" font-size="16" fill="#1e1e1e" text-anchor="middle">status = PENDING</text><text x="990.0" y="741.0" font-size="16" fill="#1e1e1e" text-anchor="middle">attempts + 1</text><text x="990.0" y="761.0" font-size="16" fill="#1e1e1e" text-anchor="middle">next_attempt_at = 분 절삭 + 1분</text><line x1="125" y1="616" x2="125" y2="680" stroke="#1e1e1e" stroke-width="2"/><polygon points="125,680 121.1058165769135,670.7893900599712 128.8941834230865,670.7893900599712" fill="#1e1e1e"/><line x1="351" y1="616" x2="351" y2="680" stroke="#1e1e1e" stroke-width="2"/><polygon points="351,680 347.10581657691347,670.7893900599712 354.89418342308653,670.7893900599712" fill="#1e1e1e"/><line x1="612" y1="616" x2="612" y2="680" stroke="#1e1e1e" stroke-width="2"/><polygon points="612,680 608.1058165769135,670.7893900599712 615.8941834230865,670.7893900599712" fill="#1e1e1e"/><line x1="788" y1="616" x2="753" y2="680" stroke="#1e1e1e" stroke-width="2"/><polygon points="753,680 754.0027201785066,670.0503993927588 760.8360084735855,673.78735392913" fill="#1e1e1e"/><text x="770.5" y="642.0" font-size="16" fill="#1e1e1e" text-anchor="middle">창 밖</text><line x1="938" y1="616" x2="938" y2="680" stroke="#1e1e1e" stroke-width="2"/><polygon points="938,680 934.1058165769135,670.7893900599712 941.8941834230865,670.7893900599712" fill="#1e1e1e"/><text x="938.0" y="642.0" font-size="16" fill="#1e1e1e" text-anchor="middle">창 안</text><line x1="1110" y1="680" x2="1110" y2="326" stroke="#1e1e1e" stroke-width="2"/><polygon points="1110,326 1113.8941834230866,335.21060994002886 1106.1058165769134,335.21060994002886" fill="#1e1e1e"/><text x="1110.0" y="497.0" font-size="16" fill="#1e1e1e" text-anchor="middle">재시도</text><rect x="40" y="810" width="1120" height="70" rx="16" fill="#fff3bf" stroke="#1e1e1e" stroke-width="2"/><text x="600.0" y="841.0" font-size="16" fill="#1e1e1e" text-anchor="middle">창 안: next &lt;= occurrence_at + RETRY_WINDOW(2분). next = now 분 절삭 + RETRY_INTERVAL(1분)</text><text x="600.0" y="861.0" font-size="16" fill="#1e1e1e" text-anchor="middle">record는 DeliveryPolicy.decide 결과로 UPDATE. 조건은 WHERE id = ? AND status = 'PENDING'</text></svg>